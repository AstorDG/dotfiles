show_cpu_cores = true
type = "sysmon"

[widget.Gpu_Usage]
custom_label = "󰾲"
scale = 1.1000000000000001
show_glyph = false
stat = "gpu_usage"
type = "sysmon"

[widget.Ram_Value]
custom_label = ""
show_glyph = false
