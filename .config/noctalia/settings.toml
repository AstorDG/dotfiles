end = [ "workspaces", "media", "volume", "clock", "bar" ]
font_family = "Fixedsys Excelsior"
font_scale = 0.75999999046325684
font_weight = 400
margin_edge = 2
margin_ends = "0%"
margin_opposite_edge = 4
padding = 10
radius = 0
scale = 1.7500000186264515
shadow = false
start = [ "control-center", "network", "Ram_Value", "Gpu_Usage", "Cpu_Temp", "Cpu_Usage" ]
thickness = 40
