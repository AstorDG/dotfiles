[notification]
enable_daemon = false

[osd]
enabled = false

[plugin_settings."hbollon/shift"]
automation = "manual"
day_start_hour = 0
holidays_enabled = false
notify_target_reached = false
weekly_hours = 0.0
work_week = "custom"

[plugin_settings."thepunkoff/pomodoro"]
panel_position = "center"

[plugins]
enabled = [ "aabidk20/yt-music", "hbollon/shift" ]

[shell]
font_family = "Fixedsys Excelsior"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    category_icons_only = true
    compact = true
    default_view = "all"
    fetch_exchange_rates = false
    provider_prefix = ">"
    search_position = "top"
    width = 1000

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    border_color = "on_primary"
    clipboard_placement = "attached"
    control_center_position = "center"
    polkit_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/winston/screen-shots"
    format = "jpeg"
    show_cursor = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

[theme]
builtin = "Tokyo-Night"
community_palette = "Cyberpunk"
custom_palette = "cyberpunk"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/winston/dotfiles/.config/hypr/wallpapers"
edge_smoothness = 0.64999998547136784
transition = [ "pixel" ]
transition_duration = 2000
transition_on_startup = true

    [wallpaper.default]
    path = "/home/winston/dotfiles/.config/hypr/wallpapers/Teahouse.png"

    [wallpaper.last]
    path = "/home/winston/dotfiles/.config/hypr/wallpapers/Teahouse.png"

    [wallpaper.monitors.DP-2]
    path = "/home/winston/dotfiles/.config/hypr/wallpapers/Teahouse.png"

[widget.Cpu_Temp]
glyph = "cpu"
stat = "cpu_temp"
type = "sysmon"

[widget.Cpu_Usage]
